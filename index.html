<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JB Chat</title><meta name="theme-color" content="#00a9e8"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fa;color:#172b3a}.app{max-width:520px;margin:auto;min-height:100vh;background:#f4f7fa;padding-bottom:78px}.top{background:#00a9e8;color:#fff;padding:18px 18px 28px;border-radius:0 0 24px 24px;box-shadow:0 6px 20px #008dcc33}.toprow{display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo span{font-weight:500}.avatar{border:0;border-radius:50%;width:40px;height:40px;background:#fff;color:#008fc8;font-weight:900}.greet{margin-top:22px}.greet b{font-size:22px}.greet p{margin:5px 0 0;opacity:.9}.balance{margin:-18px 14px 0;background:#fff;border-radius:18px;padding:17px;position:relative;box-shadow:0 5px 18px #1b405015}.balance small{color:#718394}.amount{font-size:28px;font-weight:900;margin:4px 0 12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.actions button{border:0;background:#eef9fd;border-radius:12px;padding:10px 3px;color:#007fae;font-weight:800}.actions i{font-style:normal;display:block;font-size:22px;margin-bottom:4px}.card{background:#fff;margin:14px;border-radius:18px;padding:16px;box-shadow:0 4px 16px #1b405010}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.title b{font-size:16px}.title button{border:0;background:none;color:#008fc8;font-weight:800}.services{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.service{border:1px solid #e7edf2;background:#fff;border-radius:14px;padding:12px 4px;text-align:center;color:#243d4f}.service div{font-size:25px}.service b{display:block;font-size:11px;margin-top:5px}.chat{padding:0;overflow:hidden}.chathead{padding:15px 16px;border-bottom:1px solid #edf1f4;display:flex;justify-content:space-between}.online{color:#15955c;font-size:12px;font-weight:800}.messages{height:330px;overflow:auto;padding:14px}.empty{text-align:center;color:#8292a0;padding:85px 20px}.msg{display:flex;margin:0 0 10px}.msg.u{justify-content:flex-end}.bubble{max-width:82%;padding:11px 13px;border-radius:16px;background:#edf2f5;white-space:pre-wrap;line-height:1.4}.u .bubble{background:#00a9e8;color:#fff;border-bottom-right-radius:4px}.composer{border-top:1px solid #edf1f4;padding:10px;display:flex;gap:7px}.composer input{min-width:0;flex:1;border:1px solid #dce5eb;border-radius:22px;padding:12px 14px;outline:0}.send{width:44px;border:0;border-radius:50%;background:#00a9e8;color:#fff;font-size:19px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:#fff;border-top:1px solid #e2e8ed;display:flex;justify-content:space-around;padding-top:7px;z-index:10}.bottom button{border:0;background:none;color:#738493;font-size:10px;font-weight:800}.bottom button.active{color:#00a0dc}.bottom span{display:block;font-size:22px;margin-bottom:3px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(520px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px}.sheet button{width:100%;padding:13px;border:0;border-radius:12px;background:#eef8fc;color:#0085b5;font-weight:800;margin-top:8px}</style></head><body><div class="app"><header class="top"><div class="toprow"><div class="logo">JB <span>Chat</span></div><button class="avatar" onclick="panel('Profile')">JB</button></div><div class="greet"><b>Good to see you 👋</b><p>Your AI wallet for chat, building and projects.</p></div></header><section class="balance"><small>JB Wallet</small><div class="amount">₹ 0.00</div><div class="actions"><button onclick="say('Show my profile')"><i>👤</i>Profile</button><button onclick="say('Help me make a payment')"><i>💸</i>Pay</button><button onclick="panel('Projects')"><i>📁</i>Projects</button><button onclick="panel('Agents')"><i>🤖</i>Agents</button></div></section><section class="card"><div class="title"><b>Quick services</b><button onclick="panel('Services')">View all</button></div><div class="services"><button class="service" onclick="say('Build a modern website')"><div>🌐</div><b>Website</b></button><button class="service" onclick="say('Create an app')"><div>📱</div><b>App</b></button><button class="service" onclick="say('Create a game')"><div>🎮</div><b>Game</b></button><button class="service" onclick="say('Research this idea')"><div>🔎</div><b>Research</b></button></div></section><section class="card chat"><div class="chathead"><b>JB AI Assistant</b><span class="online">● Online</span></div><div id="messages" class="messages"><div class="empty"><b>What can I do for you?</b><br>Chat, build, research or plan anything.</div></div><div class="composer"><input id="input" placeholder="Message JB Chat..." onkeydown="key(event)"><button class="send" onclick="send()">↑</button></div></section><nav class="bottom"><button class="active"><span>⌂</span>Home</button><button onclick="panel('Projects')"><span>▣</span>Projects</button><button onclick="fresh()"><span>＋</span>New</button><button onclick="panel('Agents')"><span>✦</span>Agents</button><button onclick="panel('Settings')"><span>⚙</span>Settings</button></nav><div id="modal" class="modal" onclick="if(event.target.id==='modal')closePanel()"><div class="sheet"><h3 id="sheetTitle">JB Chat</h3><p id="sheetBody">Coming soon.</p><button onclick="closePanel()">Close</button></div></div></div><script>const $=id=>document.getElementById(id);function add(text,user){let d=document.createElement('div');d.className='msg '+(user?'u':'');let b=document.createElement('div');b.className='bubble';b.textContent=text;d.appendChild(b);$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return b}async function ask(text){add(text,true);let wait=add('Thinking…',false);try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,task:'chat'})});let x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');wait.textContent=x.content||'No response.'}catch(e){wait.textContent='AI service error: '+e.message}}function send(){let x=$('input'),t=x.value.trim();if(!t)return;x.value='';ask(t)}function say(t){$('input').value=t;send()}function key(e){if(e.key==='Enter'){e.preventDefault();send()}}function fresh(){$('messages').innerHTML='<div class="empty"><b>New JB Chat</b><br>What would you like to build?</div>';$('input').focus();window.scrollTo({top:0,behavior:'smooth'})}function panel(n){$('sheetTitle').textContent='JB Chat • '+n;$('sheetBody').textContent=n==='Projects'?'Your projects will appear here.':n==='Agents'?'Choose Coding, Design, Research or Testing agents.':n==='Profile'?'JB account and wallet profile.':n==='Services'?'Website, App, Game and Research services.':'JB Chat settings.';$('modal').classList.add('show')}function closePanel(){$('modal').classList.remove('show')}</script></body></html>
